# なぜ必要か: 単体テストでは外部PostgreSQLを使わず、H2で起動確認を完結させるため。
spring.datasource.url=jdbc:h2:mem:todoapp;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# なぜ必要か: テストではFlywayのPostgreSQL専用DDLを実行せず、起動確認を最小に保つため。
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# なぜ必要か: テストでは外部OTLP送信を無効化し、ネットワーク依存なしで安定実行するため。
otel.traces.exporter=none
otel.metrics.exporter=none
otel.logs.exporter=none

# なぜ必要か: 構造化ログの key-value をテスト出力へ確実に含め、監査/相関キーの検証を安定化するため。
logging.structured.format.console=ecs
