# なぜ必要か: Datadog Unified Service Tagging と一致するサービス名をアプリ全体で一意に固定するため。
spring.application.name=todo-backend

# なぜ必要か: ECSタスクから注入されるDB接続先をSpringが読み取り、環境ごとの接続差分を吸収するため。
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_DBNAME:todoapp}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:todoapp}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:todoapp}
spring.datasource.driver-class-name=org.postgresql.Driver

# なぜ必要か: ORMが暗黙DDLを実行せず、Flyway管理スキーマとの不整合を早期検知するため。
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Tokyo

# なぜ必要か: マイグレーションを起動時に適用し、Aurora上のスキーマをコードで一元管理するため。
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# なぜ必要か: Cognitoのissuerを外部設定化し、環境ごとにJWT検証先を切り替え可能にするため。
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:https://cognito-idp.ap-northeast-1.amazonaws.com/dummy-user-pool-id}

# なぜ必要か: ALBヘルスチェック要件に合わせてヘルスエンドポイントをHTTP公開するため。
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# なぜ必要か: CloudWatch Logs Insights で機械可読に検索できるよう、コンソール出力をJSON構造化ログへ統一するため。
logging.structured.format.console=${LOGGING_STRUCTURED_FORMAT_CONSOLE:logstash}

# なぜ必要か: 本番運用時に再ビルドなしでログレベルを調整できるよう、環境変数で動的変更可能にするため。
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.example.backend=${LOGGING_LEVEL_COM_EXAMPLE_BACKEND:INFO}

# なぜ必要か: Tracer APIベースのAOP計装をinterface実装クラスにも一貫適用できるよう、クラスベースProxyを固定するため。
spring.aop.proxy-target-class=true

# なぜ必要か: Datadog横断検索で必須の service/env/version を全ログへ安定付与するため。
logging.structured.json.add.service=${DD_SERVICE:${spring.application.name}}
logging.structured.json.add.env=${DD_ENV:dev}
logging.structured.json.add.version=${DD_VERSION:unknown-version}
# なぜ必要か: traceId/spanId 形式の旧キーを除外し、trace_id/span_id へ統一するため。
logging.structured.json.exclude=traceId,spanId

# なぜ必要か: OTelリソース属性をDatadogタグと一致させ、logs/traces/metrics の相関軸を統一するため。
otel.service.name=${OTEL_SERVICE_NAME:${DD_SERVICE:${spring.application.name}}}
otel.resource.attributes=service.name=${OTEL_SERVICE_NAME:${DD_SERVICE:${spring.application.name}}},service.version=${DD_VERSION:unknown-version},deployment.environment=${DD_ENV:dev}

# なぜ必要か: ECS同一タスクのDatadog Agent sidecarへOTLP/gRPC（4317）送信を標準化し、ADRの契約に合わせるため。
otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
otel.exporter.otlp.protocol=${OTEL_EXPORTER_OTLP_PROTOCOL:grpc}
otel.traces.exporter=${OTEL_TRACES_EXPORTER:otlp}
otel.metrics.exporter=${OTEL_METRICS_EXPORTER:otlp}
otel.logs.exporter=${OTEL_LOGS_EXPORTER:none}
